<?xml version="1.0" encoding="UTF-8"?>
<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg" font-family="DejaVu Sans">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1120"/>
      <stop offset="0.55" stop-color="#0F172A"/>
      <stop offset="1" stop-color="#132237"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#10B981" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#10B981" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M60 0 H0 V60" fill="none" stroke="#1E293B" stroke-width="1" opacity="0.35"/>
    </pattern>
    <linearGradient id="chipSpark" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#34D399"/>
      <stop offset="1" stop-color="#0D9488"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <circle cx="222" cy="340" r="330" fill="url(#glow)"/>
  <rect x="0" y="0" width="1200" height="6" fill="url(#chipSpark)"/>

  <!-- Eyebrow badge -->
  <rect x="72" y="56" width="412" height="46" rx="23" fill="#16233A" stroke="#334155" stroke-width="1.5"/>
  <circle cx="100" cy="79" r="6" fill="#34D399"/>
  <text x="118" y="86" font-size="19" font-weight="bold" letter-spacing="3.5" fill="#6EE7B7">ENTERPRISE RAG PIPELINE</text>

  <!-- Logo mark composited here by the build script (x=72, y=170, 320x320) -->

  <!-- Wordmark -->
  <text x="440" y="272" font-size="100" font-weight="bold" fill="#F8FAFC" letter-spacing="-2">InsightDoc</text>
  <text x="444" y="330" font-size="33" fill="#94A3B8">Autonomous PDF Analytics &amp; Vector Search</text>
  <text x="444" y="376" font-size="24" fill="#64748B">Ingest dense PDFs — get streamed, citation-grounded</text>
  <text x="444" y="412" font-size="24" fill="#64748B">answers with page-accurate deep links.</text>

  <!-- Feature chips -->
  <g font-size="20" font-weight="bold">
    <rect x="440" y="452" width="179" height="42" rx="21" fill="#0F1B2E" stroke="#10B981" stroke-opacity="0.55" stroke-width="1.5"/>
    <text x="529" y="479" text-anchor="middle" fill="#A7F3D0">PDF Ingestion</text>

    <rect x="635" y="452" width="169" height="42" rx="21" fill="#0F1B2E" stroke="#10B981" stroke-opacity="0.55" stroke-width="1.5"/>
    <text x="719" y="479" text-anchor="middle" fill="#A7F3D0">Hybrid Search</text>

    <rect x="820" y="452" width="169" height="42" rx="21" fill="#0F1B2E" stroke="#10B981" stroke-opacity="0.55" stroke-width="1.5"/>
    <text x="904" y="479" text-anchor="middle" fill="#A7F3D0">Cited Answers</text>

    <rect x="1005" y="452" width="135" height="42" rx="21" fill="#0F1B2E" stroke="#10B981" stroke-opacity="0.55" stroke-width="1.5"/>
    <text x="1072" y="479" text-anchor="middle" fill="#A7F3D0">AI Digest</text>
  </g>

  <!-- Footer -->
  <text x="72" y="572" font-size="22" fill="#475569">Self-hostable · Vercel-ready · Open Source (MIT)</text>
  <text x="1128" y="572" font-size="22" fill="#475569" text-anchor="end">v1.0</text>
</svg>
